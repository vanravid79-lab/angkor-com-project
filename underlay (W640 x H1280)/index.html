<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Lottie 300x600 Ad</title>

	<style>
		html,

		body {
			margin: 0;
			padding: 0;
			height: 100%;

		}

		/* 🎯 Ad container */
		.banner {
			margin: 0;
			padding: 0;
		}
	</style>

	<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

	<script>
		var clickTag = "https://www.google.com";
	</script>

</head>

<body>

	<div class="banner" onclick="window.open(clickTag,'_blank')">

		<lottie-player src="./data17.json" background="transparent" speed="1" loop autoplay>
		</lottie-player>

		<!-- ============= AUTO-DISPLAY GOLDEN ANNIVERSARY FIREWORKS ============= -->
		<canvas id="auto-fireworks"
			style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99;"></canvas>
		<script>
			(function () {
				var canvas = document.getElementById('auto-fireworks');
				if (!canvas) return;
				var ctx = canvas.getContext('2d');

				var dpr = Math.min(window.devicePixelRatio || 1, 2);
				var width = window.innerWidth || 300;
				var height = window.innerHeight || 600;

				function resize() {
					width = window.innerWidth || 300;
					height = window.innerHeight || 600;
					canvas.width = width * dpr;
					canvas.height = height * dpr;
					canvas.style.width = width + 'px';
					canvas.style.height = height + 'px';
					ctx.scale(dpr, dpr);
				}
				resize();
				window.addEventListener('resize', resize);

				var stars = [];
				var blooms = [];

				// 25th Anniversary Golden Palettes (Matching Cambodia & Angkor Theme)
				var palettes = [
					{ head: '#FFFFFF', mid: '#FFE082', tail: '#FFA000' }, // Imperial Gold
					{ head: '#FFFFFF', mid: '#FFF9C4', tail: '#FFD54F' }, // Champagne Starlight
					{ head: '#FFFFFF', mid: '#E0F2FE', tail: '#38BDF8' }  // Silver Sapphire
				];

				// 1. Silky Weeping Willow Stars
				function Star(x, y, vx, vy, palette) {
					this.x = x;
					this.y = y;
					this.vx = vx;
					this.vy = vy;
					this.palette = palette;
					this.history = [{ x: x, y: y }];
					this.maxHistory = 10;
					this.drag = 0.952;    // Silky air resistance
					this.gravity = 0.046; // Graceful weeping willow cascade
					this.alpha = 1;
					this.decay = Math.random() * 0.007 + 0.008; // Long lingering sparkle
					this.size = Math.random() * 0.8 + 1.4;
					this.alive = true;
				}

				Star.prototype.update = function () {
					this.history.unshift({ x: this.x, y: this.y });
					if (this.history.length > this.maxHistory) this.history.pop();

					this.vx *= this.drag;
					this.vy *= this.drag;
					this.vy += this.gravity;
					this.x += this.vx;
					this.y += this.vy;
					this.alpha -= this.decay;

					if (this.alpha <= 0) this.alive = false;
				};

				Star.prototype.draw = function () {
					if (this.history.length < 2 || this.alpha <= 0) return;

					// Smoothly tapered comet tails
					for (var i = 0; i < this.history.length - 1; i++) {
						var p1 = this.history[i];
						var p2 = this.history[i + 1];
						var segRatio = 1 - (i / this.history.length);

						ctx.beginPath();
						ctx.moveTo(p1.x, p1.y);
						ctx.lineTo(p2.x, p2.y);
						ctx.strokeStyle = i < 2 ? this.palette.mid : this.palette.tail;
						ctx.lineWidth = this.size * segRatio;
						ctx.lineCap = 'round';
						ctx.globalAlpha = Math.max(0, this.alpha * segRatio * 0.85);
						ctx.stroke();
					}

					// Glowing star head
					ctx.fillStyle = this.palette.head;
					ctx.globalAlpha = Math.max(0, this.alpha);
					ctx.beginPath();
					ctx.arc(this.x, this.y, this.size * 0.9, 0, Math.PI * 2);
					ctx.fill();
					ctx.globalAlpha = 1;
				};

				// 2. Soft Radial Burst Flash
				function Bloom(x, y, color) {
					this.x = x;
					this.y = y;
					this.color = color;
					this.radius = 8;
					this.maxRadius = 38;
					this.alpha = 0.7;
					this.alive = true;
				}

				Bloom.prototype.update = function () {
					this.radius += 2.2;
					this.alpha -= 0.05;
					if (this.alpha <= 0 || this.radius >= this.maxRadius) this.alive = false;
				};

				Bloom.prototype.draw = function () {
					var grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
					grad.addColorStop(0, 'rgba(255, 255, 255, ' + this.alpha + ')');
					grad.addColorStop(0.35, this.color);
					grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
					ctx.fillStyle = grad;
					ctx.beginPath();
					ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
					ctx.fill();
				};

				// Blooms automatically at (x, y) without any rocket launch
				function bloom(x, y, palette) {
					blooms.push(new Bloom(x, y, palette.mid));
					var count = 52;
					var baseSpeed = 4.4;

					for (var i = 0; i < count; i++) {
						var angle = Math.random() * Math.PI * 2;
						var speed = Math.cos(Math.random() * Math.PI / 2) * baseSpeed + (Math.random() * 0.6 + 0.4);
						var vx = Math.cos(angle) * speed;
						var vy = Math.sin(angle) * speed;
						stars.push(new Star(x, y, vx, vy, palette));
					}
				}

				// Curated locations framing the top, left, and right around the 25 Years banner
				var positions = [
					{ x: 0.22, y: 0.18 }, // Top Left
					{ x: 0.78, y: 0.20 }, // Top Right
					{ x: 0.50, y: 0.14 }, // Upper Center
					{ x: 0.18, y: 0.34 }, // Mid Left
					{ x: 0.82, y: 0.36 }, // Mid Right
					{ x: 0.32, y: 0.26 }, // Center Left
					{ x: 0.68, y: 0.28 }  // Center Right
				];
				var posIndex = 0;

				function triggerAutoBurst() {
					// 30% chance of simultaneous dual bursts framing both sides
					if (Math.random() < 0.3) {
						var y = height * (0.18 + Math.random() * 0.14);
						var p1 = palettes[Math.floor(Math.random() * palettes.length)];
						var p2 = palettes[Math.floor(Math.random() * palettes.length)];
						bloom(width * (0.20 + Math.random() * 0.08), y, p1);
						setTimeout(function () {
							bloom(width * (0.80 - Math.random() * 0.08), y + (Math.random() - 0.5) * 20, p2);
						}, 140);
					} else {
						var spot = positions[posIndex % positions.length];
						posIndex++;
						var x = width * spot.x + (Math.random() - 0.5) * (width * 0.1);
						var y = height * spot.y + (Math.random() - 0.5) * (height * 0.06);
						var p = palettes[Math.floor(Math.random() * palettes.length)];
						bloom(x, y, p);
					}
				}

				var timer = 0;
				var nextBurst = 25;

				function loop() {
					requestAnimationFrame(loop);
					ctx.clearRect(0, 0, width, height);

					ctx.globalCompositeOperation = 'lighter';

					// Soft Blooms
					for (var b = blooms.length - 1; b >= 0; b--) {
						blooms[b].draw();
						blooms[b].update();
						if (!blooms[b].alive) blooms.splice(b, 1);
					}

					// Stars
					for (var s = stars.length - 1; s >= 0; s--) {
						stars[s].draw();
						stars[s].update();
						if (!stars[s].alive) stars.splice(s, 1);
					}

					ctx.globalCompositeOperation = 'source-over';

					// Automatic timing between bursts
					if (++timer >= nextBurst) {
						triggerAutoBurst();
						timer = 0;
						nextBurst = Math.floor(Math.random() * 25 + 35);
					}
				}

				// Immediate opening fireworks bloom automatically on load
				bloom(width * 0.25, height * 0.20, palettes[0]);
				setTimeout(function () {
					bloom(width * 0.75, height * 0.22, palettes[1]);
				}, 260);

				loop();
			})();
		</script>
		<!-- ===================================================================== -->

	</div>

</body>

</html>
